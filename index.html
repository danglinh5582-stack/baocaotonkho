<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Báo cáo tồn kho</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; color: #222; }
  .container { max-width: 1300px; margin: 0 auto; padding: 16px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .sub { font-size: 13px; color: #666; margin-bottom: 14px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 10px 14px; }
  .card .lb { font-size: 11px; color: #777; text-transform: uppercase; }
  .card .vl { font-size: 20px; font-weight: bold; margin-top: 4px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
  .toolbar input[type=text] { flex: 1; min-width: 220px; padding: 9px 10px; border: 1px solid #bbb; border-radius: 6px; }
  .toolbar select { padding: 9px; border: 1px solid #bbb; border-radius: 6px; }
  .toolbar label { font-size: 14px; }
  .wrap { overflow: auto; max-height: 75vh; border-radius: 8px; border: 1px solid #ddd; background: #fff; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { padding: 7px 10px; border-bottom: 1px solid #eee; white-space: nowrap; }
  th { background: #1f3a5f; color: #fff; position: sticky; top: 0; cursor: pointer; text-align: left; user-select: none; }
  td.num { text-align: right; }
  td.name { white-space: normal; min-width: 300px; }
  td.m2 { background: #fff3b0; }
  td.m3 { background: #ffd1a3; }
  td.m4 { background: #ffb3b3; }
  tfoot td { font-weight: bold; background: #eee; position: sticky; bottom: 0; }
  .legend { font-size: 12px; margin: 8px 0; color: #555; }
  .legend span { display: inline-block; width: 12px; height: 12px; margin: 0 4px 0 12px; vertical-align: middle; border: 1px solid #ccc; }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { filter: brightness(0.96); }
  #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 10; align-items: center; justify-content: center; padding: 16px; }
  #modal.open { display: flex; }
  .box { background: #fff; border-radius: 10px; width: 100%; max-width: 480px; max-height: 90vh; overflow: auto; padding: 16px; }
  .box h3 { margin: 0 0 10px; font-size: 17px; line-height: 1.4; }
  .box .row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 15px; }
  .box .row span:first-child { color: #666; }
  .box .row span:last-child { font-weight: bold; text-align: right; }
  .box button { margin-top: 14px; width: 100%; padding: 10px; border: 0; border-radius: 6px; background: #1f3a5f; color: #fff; font-size: 15px; }
  @media (max-width: 700px) {
    .c0, .c3, .c4, .c5, .c7, .c8 { display: none; }
    td.name { min-width: 0; }
    .container { padding: 10px; }
    .toolbar label:last-child { display: none; }
    .cards { grid-template-columns: repeat(2, 1fr); }
  }
  #msg { padding: 12px; background: #fff3cd; border: 1px solid #ffe08a; border-radius: 6px; margin-bottom: 12px; display: none; font-size: 14px; }
</style>
</head>
<body>
<div class="container">
  <h1>Báo cáo tồn kho</h1>
  <div class="sub">Bấm vào tiêu đề cột để sắp xếp. Gõ vào ô tìm kiếm để lọc theo mã hoặc tên hàng.</div>

  <div id="msg"></div>

  <div class="cards">
    <div class="card"><div class="lb">Số mặt hàng</div><div class="vl" id="c1">0</div></div>
    <div class="card"><div class="lb">Tổng giá trị tồn</div><div class="vl" id="c2">0</div></div>
    <div class="card"><div class="lb">Hàng tồn trên 2 tháng</div><div class="vl" id="c3">0</div></div>
    <div class="card"><div class="lb">Hàng tồn trên 3 tháng</div><div class="vl" id="c4">0</div></div>
    <div class="card"><div class="lb">Hàng tồn trên 4 tháng</div><div class="vl" id="c5">0</div></div>
  </div>

  <div class="toolbar">
    <input type="text" id="search" placeholder="Tìm theo mã hoặc tên hàng...">
    <select id="dvt"><option value="">Tất cả ĐVT</option></select>
    <label><input type="checkbox" id="old"> Chỉ hàng tồn lâu (trên 2/3/4 tháng)</label>
    <label>Chọn file Excel: <input type="file" id="file" accept=".xlsx,.xls"></label>
  </div>

  <div class="legend">
    <span style="background:#fff8e1"></span>Tồn trên 2 tháng
    <span style="background:#ffe9d6"></span>Tồn trên 3 tháng
    <span style="background:#fde0e0"></span>Tồn trên 4 tháng
  </div>

  <div class="wrap">
    <table>
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
      <tfoot id="tfoot"></tfoot>
    </table>
  </div>
</div>

<div id="modal" onclick="if(event.target===this)closeDetail()"><div class="box" id="box"></div></div>

<script>
const EXCEL_FILE = "baocaotonkho.xlsx";
const REPO_API = "https://api.github.com/repos/danglinh5582-stack/baocaotonkho/contents/";
const NUM_COLS = [3, 4, 5, 6, 7, 8];
const SUM_COLS = [3, 4, 5, 6, 7];

let headers = [], rows = [], current = [], sortCol = -1, sortAsc = true;

function openDetail(r) {
  let html = `<h3>${r[1]}</h3>`;
  headers.forEach((h, i) => {
    if (i === 1) return;
    html += `<div class="row"><span>${h}</span><span>${NUM_COLS.includes(i) ? fmt(r[i]) : r[i]}</span></div>`;
  });
  html += `<button onclick="closeDetail()">Đóng</button>`;
  $("box").innerHTML = html;
  $("modal").classList.add("open");
}
function closeDetail() { $("modal").classList.remove("open"); }

const $ = id => document.getElementById(id);
const toNum = v => {
  if (typeof v === "number") return v;
  const n = parseFloat(String(v).replace(/\./g, "").replace(",", "."));
  return isNaN(n) ? 0 : n;
};
const fmt = v => {
  const n = toNum(v);
  if (v === "" || n === 0) return "-";
  return n.toLocaleString("vi-VN");
};
const showMsg = t => { $("msg").style.display = "block"; $("msg").innerHTML = t; };

function parseCSV(text) {
  text = text.replace(/^\uFEFF/, "");
  const first = text.split(/\r?\n/)[0] || "";
  const counts = { ",": 0, ";": 0, "\t": 0 };
  for (const ch of first) if (ch in counts) counts[ch]++;
  const d = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
  const out = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === d) { row.push(cur); cur = ""; }
    else if (ch === "\n" || ch === "\r") {
      if (ch === "\r" && text[i + 1] === "\n") i++;
      row.push(cur); out.push(row); row = []; cur = "";
    } else cur += ch;
  }
  if (cur !== "" || row.length) { row.push(cur); out.push(row); }
  return out;
}

function parseWorkbook(buf) {
  try {
    const wb = XLSX.read(buf, { type: "array" });
    const ws = wb.Sheets[wb.SheetNames[0]];
    build(XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" }));
  } catch (e) {
    showMsg("Không đọc được file Excel: " + e.message);
  }
}

function build(aoa) {
  try {
    let h = aoa.findIndex(r => r.some(c => String(c).trim().toUpperCase() === "MÃ"));
    if (h < 0) h = 0;
    headers = aoa[h].slice(0, 9).map(String);
    rows = aoa.slice(h + 1).filter(r => r.slice(0, 2).some(c => c !== "")).map(r => r.slice(0, 9));
    $("msg").style.display = "none";
    const dvts = [...new Set(rows.map(r => String(r[2]).trim()).filter(Boolean))].sort();
    $("dvt").innerHTML = '<option value="">Tất cả ĐVT</option>' + dvts.map(d => `<option>${d}</option>`).join("");
    render();
  } catch (e) {
    showMsg("Không đọc được dữ liệu: " + e.message);
  }
}

function render() {
  const q = $("search").value.trim().toLowerCase();
  const dvt = $("dvt").value;
  const onlyOld = $("old").checked;

  let list = rows.filter(r =>
    (!q || String(r[0]).toLowerCase().includes(q) || String(r[1]).toLowerCase().includes(q)) &&
    (!dvt || String(r[2]).trim() === dvt) &&
    (!onlyOld || toNum(r[3]) > 0 || toNum(r[4]) > 0 || toNum(r[5]) > 0));

  if (sortCol >= 0) {
    list = [...list].sort((a, b) => {
      let x = a[sortCol], y = b[sortCol];
      if (NUM_COLS.includes(sortCol)) { x = toNum(x); y = toNum(y); }
      else { x = String(x).toLowerCase(); y = String(y).toLowerCase(); }
      return (x > y ? 1 : x < y ? -1 : 0) * (sortAsc ? 1 : -1);
    });
  }

  $("thead").innerHTML = "<tr>" + headers.map((h, i) =>
    `<th class="c${i}" data-i="${i}">${h}${sortCol === i ? (sortAsc ? " ▲" : " ▼") : ""}</th>`).join("") + "</tr>";

  current = list;
  $("tbody").innerHTML = list.map((r, idx) => {
    return `<tr data-idx="${idx}">` + r.map((c, i) => {
      const hl = (i >= 3 && i <= 5 && toNum(c) > 0) ? " m" + (i - 1) : "";
      return `<td class="c${i} ${NUM_COLS.includes(i) ? "num" : i === 1 ? "name" : ""}${hl}">${NUM_COLS.includes(i) ? fmt(c) : c}</td>`;
    }).join("") + "</tr>";
  }).join("");

  const sum = i => list.reduce((s, r) => s + toNum(r[i]), 0);
  $("tfoot").innerHTML = "<tr>" + headers.map((_, i) =>
    i === 1 ? `<td class="c1">TỔNG CỘNG</td>` :
    SUM_COLS.includes(i) ? `<td class="c${i} num">${sum(i).toLocaleString("vi-VN")}</td>` : `<td class="c${i}"></td>`
  ).join("") + "</tr>";

  document.querySelectorAll("#tbody tr").forEach(tr => tr.onclick = () => openDetail(current[+tr.dataset.idx]));

  $("c1").textContent = list.length.toLocaleString("vi-VN");
  $("c2").textContent = sum(7).toLocaleString("vi-VN");
  $("c3").textContent = list.filter(r => toNum(r[3]) > 0).length;
  $("c4").textContent = list.filter(r => toNum(r[4]) > 0).length;
  $("c5").textContent = list.filter(r => toNum(r[5]) > 0).length;

  document.querySelectorAll("th").forEach(th => th.onclick = () => {
    const i = +th.dataset.i;
    sortAsc = sortCol === i ? !sortAsc : true;
    sortCol = i;
    render();
  });
}

["search", "dvt", "old"].forEach(id => $(id).addEventListener("input", render));
$("file").addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) return;
  if (/\.csv$/i.test(f.name)) f.text().then(t => build(parseCSV(t)));
  else f.arrayBuffer().then(parseWorkbook);
});

async function loadUrl(name) {
  const r = await fetch(encodeURI(name) + "?t=" + Date.now());
  if (!r.ok) throw new Error("not found");
  if (/\.csv$/i.test(name)) build(parseCSV(await r.text()));
  else parseWorkbook(await r.arrayBuffer());
}

async function load() {
  // 1) thử các tên file mặc định
  for (const n of ["baocaotonkho.csv", "baocaotonkho.xlsx"]) {
    try { await loadUrl(n); return; } catch (e) {}
  }
  // 2) dò file .csv/.xlsx bất kỳ trong repo
  try {
    const files = await (await fetch(REPO_API)).json();
    const x = files.find(f => /\.(csv|xlsx?)$/i.test(f.name));
    if (x) { await loadUrl(x.name); return; }
  } catch (e) {}
  showMsg("Không tìm thấy file dữ liệu trong repo. Hãy tải file <b>baocaotonkho.csv</b> lên cùng thư mục với index.html trên GitHub, hoặc bấm <b>Chọn file</b> bên dưới để xem tạm.");
}
load();
</script>
</body>
</html>
